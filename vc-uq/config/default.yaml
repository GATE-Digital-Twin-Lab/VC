# vc-uq: all knobs live here. No magic numbers in code.
# Every value referenced by src/ must appear in this file.

run:
  name: default
  seed: 20260826
  data_root: data
  results_root: results
  # Cache key = (model, dataset, q_id, draw_idx, T, prompt_variant, seed).
  # Generation is append-only and downstream phases are pure functions of the
  # cache. That is structural in store.py, not a switch.
  # Derived output (tables, figures, processed parquet) goes to
  #   <results_root>/<runs_subdir>/<timestamp>__<run.name>/
  # The raw generation cache does NOT live there: it is shared across runs and
  # keyed by run.name, because re-sampling it is the one thing this design
  # exists to avoid.
  runs_subdir: runs
  timestamp_format: "%Y%m%d-%H%M%S"

model:
  # Backend selects a transport in src/vc_uq/backends/.
  #   mock          -- synthetic generator with known p_q; used for tests + smoke runs
  #   llamacpp      -- llama-cpp-python, in-process, full-vocab logits available
  backend: llamacpp
  # `name` is part of the generation CACHE KEY (schemas.ANSWER_KEY), so changing
  # it orphans every draw already on disk. Fix it once, at the start of a study.
  name: gemma-3-27b-it-qat-q4_0
  mock:
    # Latent truth for the simulated world. These are the values the analysis
    # code is checked against; they are not claims about any real model.
    world_seed: 7
    t_ref: 0.8
    temp_sensitivity: 1.6          # p_q moves with T ...
    diversity_temp_sensitivity: 0.5
    p_q_beta: [0.8, 0.9]
    error_correlation: 0.75        # common-mode wrong answers => product rule over-claims
    low_diversity_share: 0.5       # populates the dangerous low-diversity-U cell
    n_wrong_pool: 6
    vc_informativeness: 0.35       # VC is informative but weakly so
    vc_floor: 0.7                  # ... while VC never leaves [0.7, 1]: the range collapse
    vc_within_sd: 0.01             # ~0 => VC attaches to the prompt, not the answer
    prehoc_noise: 0.08             # vc_pre wobble from one repeat to the next
    prehoc_blind_to_fabricated: true   # vc_pre does not drop on invented entities
  llamacpp:
    # HF repo + GGUF file. Downloaded via huggingface_hub on the target machine.
    # Google's QAT q4_0 release: quantisation-aware trained, so it is much
    # closer to the bf16 model than a post-hoc q4 would be -- which matters here
    # because p_q and the token-entropy baselines are properties OF THE DECODER,
    # and a lossy quantisation is a change to the decoder.
    # 17.2 GB. llama.cpp's default split mode is by LAYER across every visible
    # device, so it lands as ~9 GB + ~12 GB across the two 5090s regardless of
    # main_gpu (which only bites in split modes NONE and ROW). That is fine
    # here: generation and judging run as separate invocations, so the embedder
    # and the NLI head are never resident alongside it.
    repo_id: google/gemma-3-27b-it-qat-q4_0-gguf
    filename: gemma-3-27b-it-q4_0.gguf
    model_path: null          # set to bypass the HF download and use a local file
    n_ctx: 4096
    n_gpu_layers: -1          # -1 = offload everything; 2x5090 has the room
    n_batch: 512
    main_gpu: 0
    tensor_split: null        # e.g. [0.5, 0.5] to split across the two 5090s
    flash_attn: true
    verbose: false
    # null = use the GGUF's own tokenizer.chat_template, which is what
    # create_chat_completion applies. Set this only when a GGUF carries no
    # template: teacher forcing has to rebuild the prompt exactly, and the
    # backend refuses to guess rather than compute h_tok under a wrong context.
    chat_format: null
  generation:
    # The complete decoder specification. Every one of these is passed
    # EXPLICITLY on every call (backends/base.py SamplingParams), because
    # backend defaults are not neutral: llama.cpp ships top_k=40, top_p=0.95,
    # min_p=0.05, repeat_penalty=1.1. p_q is definitionally a function of the
    # decoder, so the 8.1 temperature sweep only measures T if T is the only
    # thing shaping the distribution. The values below are the unrestricted
    # decoder the protocol requires; a pitfall check fails if they are narrowed.
    max_tokens: 256
    # NO whitespace-only stop sequences. The elicitation format spans two lines
    # and instruct models routinely put a blank line between them, so a "\n\n"
    # stop halts generation BEFORE the confidence line exists -- on every draw,
    # in a study about that number. The parser is layout-agnostic, but it cannot
    # recover tokens that were never emitted. create_chat_completion already
    # stops at the model's own end-of-turn token; these are belt and braces for
    # models that emit the marker as text. A pitfall check enforces this.
    stop: ["</s>", "<|eot_id|>", "<|im_end|>"]
    top_p: 1.0
    top_k: 0                  # 0 = disabled
    min_p: 0.0
    repeat_penalty: 1.0

embedding:
  # Used for e_cos (correctness criterion) and s_anchor (label-free score).
  backend: sentence_transformers   # mock | llamacpp | sentence_transformers
  name: Qwen3-Embedding-4B
  dim: 64
  mock:
    noise: 0.35        # instrument quality, independent of model quality
    seed: 11
  llamacpp:
    repo_id: nomic-ai/nomic-embed-text-v1.5-GGUF
    filename: nomic-embed-text-v1.5.Q8_0.gguf
    model_path: null
    n_ctx: 2048
    n_gpu_layers: -1
  sentence_transformers:
    # Phase 0 is a gate ON THIS CHOICE: if e_cos cannot separate correct from
    # incorrect at AUROC 0.85 the study stops and switches to NLI. A stronger
    # embedder is therefore not a luxury, it is the thing being validated.
    # 2560-dim, last-token pooled, ~8 GB in fp16.
    name: Qwen/Qwen3-Embedding-4B
    batch_size: 16          # STEmbedder.encode; nli.hf.batch_size is separate
    device: cuda:1          # pinned so the two torch models share one card
  # Anisotropy correction (Phase 0 known failure mode). Applied to the whole
  # embedding matrix of a split before any cosine is taken.
  postprocess:
    mean_center: true         # subtract the split mean
    whiten: false             # ZCA whitening; stronger, needs more vectors than dims
    rank_transform_s: true    # rank-transform s_anchor within split; only order matters

nli:
  # Bidirectional entailment: clustering (6.6) and correct_nli. Never cosine -- negation-blind.
  backend: hf                 # mock | hf | llm
  mock:
    error_rate: 0.05
    seed: 13
  hf:
    # `microsoft/deberta-v3-large-mnli` does not exist on the Hub -- Microsoft
    # released deberta-v3-large without an MNLI head. This is the v1 model, and
    # it is also the one Kuhn et al. and Farquhar et al. use for
    # bidirectional-entailment clustering, so the 6.6 diversity numbers are
    # comparable to the semantic-entropy literature rather than to a judge
    # nobody else has run.
    name: microsoft/deberta-large-mnli
    batch_size: 32
    device: cuda:1            # alongside the embedder, on one card
  llm:
    prompt_variant: nli_bidirectional_v1
    max_tokens: 8
  entail_threshold: 0.5

dataset:
  datasets: [triviaqa, fabricated]
  triviaqa:
    hf_name: mandarjoshi/trivia_qa
    hf_config: rc.nocontext
    hf_split: validation
    n_questions: 1200
    max_question_chars: 400
  fabricated:
    # p_q = 0 by construction: invented entities the model cannot know.
    n_questions: 200
    seed: 991
  splits:
    # Four-way split BY q_id, never by draw (protocol 4). Assignment is a hash
    # of q_id so it is stable when questions are added later; the cost is that
    # sizes are binomial around these targets rather than exact quotas, and
    # stratify_by salts the hash per group rather than dealing out quotas within
    # it. A pitfall check reports the realised shares.
    tau_select: 0.10
    classify: 0.30
    calib: 0.35
    eval: 0.25
    stratify_by: dataset
    # Absolute share deviation past which the imbalance is worth a sentence in
    # the writeup. At n = 1200 the hash lands within ~0.01; at n = 200 it can be
    # off by 0.07, which is 14 of 70 calibration questions.
    max_share_deviation: 0.04

generation:
  n_max: 40                   # N_MAX draws per question
  # Flush generated draws into the append-only cache every this many draws.
  # At 27B and ~2.4 s/draw a full pass is hours of GPU time, and a table that is
  # only written at the end turns any kill signal, OOM or node eviction into a
  # total loss. The cache is keyed and append-only, so a partial write is a
  # smaller valid cache, not a corrupt one -- and `resume` picks up from it.
  # Each flush rewrites the parquet, so this trades a few seconds of IO per
  # checkpoint against how much work a crash can destroy. 0 disables it.
  checkpoint_every: 200
  # Progress bars during generation (tqdm, on stderr so stdout JSON stays clean).
  #   auto   -- bar when stderr is a terminal, silent when redirected to a log
  #   always -- bar even when redirected; throttled to one line every 30s so an
  #             84k-draw run does not write 84k lines into the log
  #   never  -- off
  progress: auto
  # Protocol 6.4 step 3. Phase 1 draws N_MAX on EVERY question (the "classify"
  # pass) and then draws a second, independent N_MAX on the questions in these
  # splits (the "downstream" pass). The first decides in_U; the second is what
  # Phase 2, Phase 4 and 6.7 are calibrated and evaluated on. Deciding U with
  # the same draws that are later certified is selection on the outcome being
  # certified: it voids the LTT guarantee, and it makes the 6.7 U-curve
  # tautological -- "none of the first k draws was correct" is true by
  # construction for every question the subset was defined to contain, so the
  # observed frequency reads 1.0 at every k whatever VC claimed.
  #
  # The cost is one extra generation pass over these splits (~1.6x total at the
  # default shares). Set to [] to reproduce the single-pass behaviour, and then
  # do not quote 6.7 or Phase 4.
  downstream_splits: [calib, eval]
  temperature: 0.8            # fixed T for the main table
  r_pre: 10                   # vc_pre elicitations per question
  prompt_variant_post: vc_post_v1
  prompt_variant_pre: vc_pre_v1
  prompt_variant_clean: answer_clean_v1   # no VC instruction; used for teacher-forced h_tok
  # Elicitation is the measurement. If VC cannot be parsed off this share of
  # draws the run is not a weak result, it is no result, and a pitfall check
  # fails rather than letting Phase 2 dropna its way to an empty table.
  max_vc_parse_failure_rate: 0.05
  token_stats:
    # Storing per-position entropies for all draws is large; keep summaries always
    # and full arrays for a subsample (protocol 4).
    store_per_position_fraction: 0.10
    teacher_force_clean_prompt: true      # h_tok under a non-augmented prompt too
  # No chat history across draws. Setting this false raises: dependent draws
  # would make every independence statement in 5.7 and 6.7 untestable.
  fresh_context_per_draw: true

anchor:
  # anchor(q) must be DETERMINISTIC and built identically at calib and test.
  #   medoid -- medoid of the N draws; radius around it doubles as the diversity measure
  #   greedy -- T=0 decode
  method: medoid
  greedy_temperature: 0.0
  greedy_max_tokens: 128

phase0:
  n_hand_label: 300
  # Stratify labelling across datasets and across the e_cos range -- a random
  # sample is almost all easy and tells you nothing about the boundary.
  stratify_bins: 10
  tau_grid: {start: 0.05, stop: 0.95, step: 0.01}
  gate:
    kappa_min: 0.70
    auroc_min: 0.85
  null_band:
    n_mismatched_pairs: 5000  # e_cos on (a_i, a_star_j), i != j
    overlap_min_auroc: 0.75   # below this the instrument cannot resolve the effect
  tau_sensitivity: 0.05       # re-report every headline at tau_star +/- this
  labels:
    # Hand labels are the one irreproducible input in the study, so only
    # correct_human is taken from the CSV; e_cos and everything else is
    # recomputed. e_cos is NOT a stable property of a pair -- the embedding
    # space is mean-centred over whichever texts were scored together -- so a
    # stale value from an old CSV would select tau_star against numbers that no
    # longer exist.
    shuffle_sheet: true       # partial labelling must not silently destratify
    # One row per DISTINCT (question, answer), not per draw. With N_MAX draws a
    # question the model is confident about repeats the same string many times;
    # those rows cost human effort and cannot disagree with each other, so
    # counting them separately inflates kappa's and AUROC's effective n.
    unique_answers: true
    min_per_stratum: 1        # refuse if any stratum has no labelled pair
    min_coverage: 0.5         # warn below this share of the sheet labelled

phase2:
  # Reliability: ANSWER-level grouping by vc_post is primary. VC's discreteness
  # supplies the bins; do not impose fixed-width ones.
  binning: model_defined      # model_defined | adaptive
  adaptive_n_bins: 10
  bootstrap:
    n_resamples: 2000         # CLUSTER bootstrap over questions, never over answers
    ci: 0.95
  min_group_n: 10             # groups smaller than this are reported but not plotted
  # Below this share of VC variance sitting WITHIN questions, answer-level
  # grouping has degenerated to question-level: VC is a property of the prompt.
  vc_within_share_prompt_threshold: 0.10
  within_question_auroc_min_per_class: 1

phase3:
  km_flatness:
    # If S(k) is still declining at N_MAX, U is a censoring artifact.
    tail_window: 5
    max_tail_slope: 0.005
  hazard_max_k: 20
  budget_alpha: 0.1           # alpha used for N_hat = ceil(log a / log(1-VC))
  product_rule:
    k_values: [1, 2, 3, 5, 10]
    n_bins: 12
    log_floor: 1.0e-6

phase4:
  alphas: [0.05, 0.1, 0.2]
  delta: 0.1
  restrict_to_A: true         # primary; beta_eff = 0. States it conditions on solvability.
  # 7.1 robustness: repeat the comparison on ALL questions (U included) at
  # alphas above beta. Values at or below beta are skipped, since no rule of
  # any kind is certifiable there and the table would be blank by arithmetic.
  robustness_alphas: [0.2, 0.3]
  grid:
    # lambda_qual, lambda_div and every rule's lambda_stop EXCEPT vc_product are
    # searched over [0, 1]. Each score is rescaled to the unit interval first
    # (see clm.RULE_UNITS and clm.QUALITY_SCORES), so a threshold reads directly
    # and is comparable across rules and models rather than being a number on
    # whatever scale a particular statistic happened to have.
    #
    # vc_product is the exception, and deliberately so: its lambda_stop is a
    # LOG-probability in nats, on the same scale as the Lambda_k it is compared
    # against. The claim compounds, so the interesting thresholds span orders of
    # magnitude -- as a probability they would bunch against 0 and be unreadable,
    # while -5 nats and -20 nats are two legible numbers. This is also the scale
    # 6.7 reports the product-rule gap on, so the two are directly comparable.
    #
    # Watch phase4_summary's `n_families_distinct`. delta is divided by the
    # number of (lambda_qual, lambda_div) cells, so grid points that behave
    # identically are lost power, not merely wasted compute.
    lambda_qual: {num: 10}
    lambda_div:  {num: 10}
    lambda_stop:
      num: 10
      # vc_product only. Its grid spans log(product_floor) .. 0 nats, plus -inf
      # meaning "never stop early" -- the conservative anchor the fixed sequence
      # starts from, and the only grid point guaranteed to be reachable at any
      # N_MAX. Lower this if N_MAX is large enough that the strictest finite
      # threshold still fires early.
      product_floor: 1.0e-6
  # Every rule reads the RETAINED set C(q), never the raw draw stream: an
  # answer the quality or diversity gate rejected cannot be the evidence that
  # ends sampling. That is what makes lambda_qual and lambda_div matter -- a
  # stricter gate admits less, the statistic advances more slowly, and the rule
  # spends more draws to reach the same threshold.
  #
  #   vc_product     sum log(1 - vc) over C(q) falls to lambda_stop
  #   vc_max         the most confident answer IN C(q) reaches lambda_stop
  #   token_entropy  the lowest-entropy answer in C(q) reaches lambda_stop
  #   fixed_k        |C(q)| reaches lambda_stop * N_MAX -- the null baseline
  #
  # vc_first and vc_prehoc are gone: both fix the budget from a single number
  # (the first draw's VC, or a pre-hoc estimate) and cannot read C(q) at all, so
  # they belong to a different family from everything here. min_token_p is gone
  # too -- token_entropy already carries the token-level mechanism, and two
  # near-identical baselines cost multiplicity without adding an argument.
  stop_rules:
    - vc_product
    - vc_max
    - token_entropy
    - fixed_k          # mandatory null baseline
  # self_consistency and semantic_entropy are NOT here. They are diversity
  # statistics over a set of draws, and at k = 1 they are undefined rather than
  # extreme: one draw is one cluster, so entropy reads 0 and largest-share reads
  # 1 -- the exact values that make a "stop when converged" rule fire. Every
  # grid point then stops at the first draw. Imposing a minimum draw count
  # would fix that by changing the efficiency each rule reports, so they are
  # reported DESCRIPTIVELY instead: `f` per answer in the Phase 2 AUROC
  # comparison, H_sem and largest_cluster_share per question in the 6.6
  # diversity 2x2. Their mechanism is still represented in the baseline table.
  # Which score admits an answer INTO the set. This must not be VC.
  #
  # `logp_mean` is the length-normalised log-likelihood of the generated answer,
  # which is what conformal language modelling uses for admission. Phase 4 exists
  # to test VC as a STOPPING signal against baselines at equal risk; if VC also
  # decided which answers were retained, then every baseline -- token entropy,
  # min token probability, even fixed_k -- would be scored on a set that VC had
  # already filtered. There would be no VC-free arm left to compare against, and
  # a difference in draws could not be attributed to the stopping rule.
  #
  #   likelihood   length-normalised likelihood p(y|x)^(1/T) = exp(mean_t log p_t),
  #                the geometric mean per-token probability. In [0, 1] by
  #                construction, which is why lambda_qual is a [0, 1] grid.
  #                DEFAULT; the CLM choice.
  #   anchor_sim   ablation: cos(anchor, a_i), i.e. retention by agreement with
  #                the anchor, which biases toward mode collapse. Also [0, 1].
  #   vc_post      DIAGNOSTIC ONLY. Contaminates every baseline; a pitfall check
  #                fails fatally when it is combined with VC stopping rules.
  quality_score: likelihood
  fwer: fixed_sequence        # fixed_sequence | bonferroni
  vacuity:
    # Lambda_hat must contain configs that actually stop early, else every method
    # ties at the ceiling and the table says nothing.
    max_early_stop_fraction_of_n_max: 0.9
  strata:
    p_hat_edges: [0.0, 0.1, 0.3, 0.6, 1.0]

phase5:
  temperature_sweep:
    temperatures: [0.0, 0.3, 0.7, 1.0, 1.3, 1.5]
    n_questions: 100
    n_draws: 20
  paraphrase:
    variants: [vc_post_v1, vc_post_v2, vc_post_v3, vc_post_v4, vc_post_v5,
               vc_post_v6, vc_post_v7, vc_post_v8, vc_post_v9, vc_post_v10]
  # Scale reframing, the sycophancy probe, the forced-decode intervention and
  # the pre-hoc metacognition probes are out of scope (protocol 8). Each varied
  # more than one thing at a time and needed its own control arm; the invariance
  # claim rests on the two matched comparisons above.

phase6:
  fit_on: triviaqa
  apply_to: fabricated
  isotonic:
    out_of_bounds: clip
  report_gap_metric: mae      # mean |p_hat_g - v_g| over model-defined groups

aggregation:
  # The product rule Pi_k = prod_i (1 - vc_i) is accumulated as a SUM OF LOGS,
  # Lambda_k = sum_i log(1 - vc_i). log is strictly increasing, so the stopping
  # decision `Pi_k <= t` is identical to `Lambda_k <= log t`; what changes is
  # that the statistic stays representable at any k, and that the grid searched
  # in Phase 4 spreads over orders of magnitude instead of piling up near 0.
  #
  # Clamp on (1 - vc) before the log. NOT numerical hygiene: vc = 1.0 asserts a
  # zero failure probability, which in the linear form annihilates the product
  # so that one answer satisfies every threshold at once. This caps a single
  # answer's claim at a one-in-a-million failure rate.
  one_minus_vc_floor: 1.0e-6

judge:
  primary: cos                # cos | nli ; Phase 0 flips this to nli if AUROC < gate
  tau_star: null              # filled by Phase 0; null means "not yet validated"

plots:
  dpi: 150
  figsize: [6.0, 4.0]
  style: seaborn-v0_8-whitegrid
